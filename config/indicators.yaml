        label: {pl: "Oświetlenie ulic", cs: "Osvětlení ulic", en: "Street lighting"}
        unit: pct
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Oświetlone ulice: {{value}}%", cs: "Osvětlené ulice: {{value}} %", en: "Lit streets: {{value}}%"}

