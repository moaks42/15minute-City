        norm: {type: percentile}
        weight: 3
        crossCity: true
        priority: P0
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "{{value}} km dróg rowerowych w promieniu 1 km", cs: "{{value}} km cyklostezek do 1 km", en: "{{value}} km of cycle paths within 1 km"}
      - id: intersection_density
