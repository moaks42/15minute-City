        weight: 1
        crossCity: false
        priority: P2
        cities: [praha]
        sources: {praha: [bikeshare_praha, golemio]}
        explain: {pl: "Rower miejski {{value}} min pieszo", cs: "Sdílené kolo {{value}} min pěšky", en: "Bike share {{value}} min walk"}

