        decimals: 0
        norm: {type: inverse_percentile}
        weight: 3
        crossCity: false
        noWarning: true
        priority: P0
        sources: {krakow: [safety_krk], praha: [police_cz]}
        explain: {pl: "Zarejestrowane przestępstwa w dzielnicy: {{value}} na 1000 mieszk.", cs: "Evidované trestné činy v městské části: {{value}} na 1000 obyv.", en: "Recorded crime in district: {{value}} per 1,000 residents"}
