      - id: benches_300m
        label: {pl: "Ławki (300 m)", cs: "Lavičky (300 m)", en: "Benches (300 m)"}
        unit: count
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Ławki w promieniu 300 m: {{value}}", cs: "Lavičky do 300 m: {{value}}", en: "{{value}} benches within 300 m"}
      - id: slope_pct
        label: {pl: "Nachylenie terenu", cs: "Sklon terénu", en: "Terrain slope"}
        unit: pct
        decimals: 1
        norm: {type: decay, good: 2, bad: 8}
        weight: 1
        crossCity: true
        priority: P2
        sources: {krakow: [dem], praha: [dem]}
        explain: {pl: "Średnie nachylenie {{value}}%", cs: "Průměrný sklon {{value}} %", en: "Average slope {{value}}%"}

