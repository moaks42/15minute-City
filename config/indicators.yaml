    label: {pl: "Kultura, sport i gastronomia", cs: "Kultura, sport a gastronomie", en: "Culture, sport & food"}
    indicators:
      - id: food_10min
        label: {pl: "Restauracje i kawiarnie (10 min)", cs: "Restaurace a kavárny (10 min)", en: "Restaurants & cafés (10 min)"}
        unit: count
        norm: {type: percentile}
        weight: 2
