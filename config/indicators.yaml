  - {id: kindergarten,   emoji: "🧒", column: "education.kindergarten_walk_min",   label: {pl: "Przedszkole",       cs: "Mateřská škola",        en: "Kindergarten"}}
  - {id: primary_school, emoji: "🏫", column: "education.primary_school_walk_min", label: {pl: "Szkoła podstawowa", cs: "Základní škola",        en: "Primary school"}}
