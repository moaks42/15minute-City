        decimals: 1
        norm: {type: inverse_percentile}
        weight: 1
        crossCity: false        # city-level offset (K Lden vs P LAeq; regional PM) dominates → not comparable across cities
        priority: P0
        sources: {krakow: [gios], praha: [chmi_air]}
        explain: {pl: "PM10 ok. {{value}} µg/m³", cs: "PM10 cca {{value}} µg/m³", en: "PM10 ~{{value}} µg/m³"}
      - id: major_road_m
        label: {pl: "Odległość od głównej drogi", cs: "Vzdálenost od hlavní silnice", en: "Distance to major road"}
        unit: m
        norm: {type: decay, good: 300, bad: 30}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Główna droga {{value}} m dalej", cs: "Hlavní silnice {{value}} m daleko", en: "Major road {{value}} m away"}
      - id: industrial_ha_1km
        label: {pl: "Tereny przemysłowe (1 km)", cs: "Průmyslové plochy (1 km)", en: "Industrial land (1 km)"}
        unit: ha
        norm: {type: inverse_percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Tereny przemysłowe w promieniu 1 km: {{value}} ha", cs: "Průmyslové plochy do 1 km: {{value}} ha", en: "{{value}} ha of industrial land within 1 km"}

