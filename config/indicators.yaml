# Kompas — SINGLE SOURCE OF TRUTH for criteria, indicators, norms, personas and labels (pl/cs/en).
# Owner: Workstream B. Changes after contracts-v1 are ADDITIVE ONLY (see docs/notes/B.md "Contract changes").
#
# Column naming: every indicator reads the features.parquet column "<criterion>.<indicator>"
# unless it sets `column:` (an alias that reuses another indicator's column).
#
# norm types (engine, per city, over habitable cells; output is a 0–100 sub-score):
#   decay              linear between `good` (→100) and `bad` (→0), clamped. good<bad: lower is better
#                      (minutes, metres to noise…); good>bad: higher is better (shares, distances away).
#                      If `walkScaled: true`, the raw value is multiplied by the persona walkFactor before
#                      scoring (slower walkers perceive the same walk as longer). Explanations show raw values.
#   percentile         rank among the city's habitable cells (higher value = better)
#   inverse_percentile rank, inverted (lower value = better): price, noise, PM, crime
#   threshold          100 if value >= `at`, else 0
# Missing values: imputed with the city median and flagged `imputed`. Indicator with 0% coverage in a city
# is dropped from that city's criterion average and reported via /meta coverage.
#
# Explanation templates: {{value}} is the RAW feature value, formatted per language
# (pl/cs: "12 450", "3,5"; en: "12,450", "3.5"), rounded to `decimals` (default 0).
# Templates are written to avoid plural agreement (counts go after a colon or before a rate unit).
#
# `cities:` restricts an indicator to the listed cities (omitted = all cities).
# `crossCity: true` = absolute, comparable value → used for archetypes and twin neighbourhoods.
# `noWarning: true` = never used as a warning text (avoids stigmatizing wording).
# `priority:` P0 bold in README §3.3, P1 should, P2 could.

version: 1
walkSpeedKmh: 4.8

levels: {0: 0, 1: 1, 2: 2, 3: 3, 4: 5, 5: 8}
levelEmoji: {0: "", 1: "😐", 2: "🙂", 3: "😊", 4: "😍", 5: "🤩"}
levelLabel:
  0: {pl: "Pomiń",        cs: "Přeskočit",      en: "Skip"}
  1: {pl: "Mało ważne",   cs: "Málo důležité",  en: "Barely matters"}
  2: {pl: "Miło by było", cs: "Bylo by fajn",   en: "Nice to have"}
  3: {pl: "Ważne",        cs: "Důležité",       en: "Important"}
  4: {pl: "Bardzo ważne", cs: "Velmi důležité", en: "Very important"}
  5: {pl: "Kluczowe",     cs: "Zásadní",        en: "Essential"}

units:
  min:          {pl: "min",             cs: "min",           en: "min"}
  dep_h:        {pl: "odj./h",          cs: "odj./h",        en: "dep./h"}
  count:        {pl: "",                cs: "",              en: ""}
  km:           {pl: "km",              cs: "km",            en: "km"}
  m:            {pl: "m",               cs: "m",             en: "m"}
  pct:          {pl: "%",               cs: "%",             en: "%"}
  ha:           {pl: "ha",              cs: "ha",            en: "ha"}
  per_km2:      {pl: "/km²",            cs: "/km²",          en: "/km²"}
  db:           {pl: "dB",              cs: "dB",            en: "dB"}
  ugm3:         {pl: "µg/m³",           cs: "µg/m³",         en: "µg/m³"}
  per_1000:     {pl: "na 1000 mieszk.", cs: "na 1000 obyv.", en: "per 1,000 residents"}
  pln_m2:       {pl: "zł/m²",           cs: "zł/m²",         en: "PLN/m²"}
  czk_m2_month: {pl: "Kč/m²/mies.",     cs: "Kč/m²/měs.",    en: "CZK/m²/month"}

modes:
  transit: {emoji: "🚋", label: {pl: "Komunikacja", cs: "MHD",   en: "Transit"}, phrase: {pl: "komunikacją", cs: "MHD",    en: "by transit"}}
  bike:    {emoji: "🚲", label: {pl: "Rower",       cs: "Kolo",  en: "Bike"},    phrase: {pl: "rowerem",     cs: "na kole", en: "by bike"}}
  walk:    {emoji: "🚶", label: {pl: "Pieszo",      cs: "Pěšky", en: "Walk"},    phrase: {pl: "pieszo",      cs: "pěšky",   en: "on foot"}}

criteria:
  # ───────────────────────────────────────────── commute (runtime, from anchors + travel_times.npz)
  - id: commute
    emoji: "🧭"
    label: {pl: "Dojazd do moich miejsc", cs: "Dojezd do mých míst", en: "Commute to my places"}
    runtime: anchors          # no features.parquet columns; S = Σ_a W(a)·decay(t_a) / Σ W(a); ignored without anchors
    norm: {type: decay, good: 15, bad: 60}
    explain: {pl: "{{anchor}}: {{value}} min {{mode}}", cs: "{{anchor}}: {{value}} min {{mode}}", en: "{{anchor}}: {{value}} min {{mode}}"}
    sources: {krakow: [osm_krakow, gtfs_ztp], praha: [osm_praha, gtfs_pid]}
    indicators: []

  # ───────────────────────────────────────────── transit
  - id: transit
    emoji: "🚋"
    label: {pl: "Komunikacja miejska", cs: "Veřejná doprava (MHD)", en: "Public transport"}
    indicators:
      - id: stop_walk_min
        label: {pl: "Najbliższy przystanek", cs: "Nejbližší zastávka", en: "Nearest stop"}
        unit: min
        norm: {type: decay, good: 3, bad: 12}
        walkScaled: true
        weight: 3
        crossCity: true
        priority: P0
        sources: {krakow: [gtfs_ztp, osm_krakow], praha: [gtfs_pid, osm_praha]}
        explain: {pl: "Przystanek {{value}} min pieszo", cs: "Zastávka {{value}} min pěšky", en: "Stop {{value}} min walk"}
      - id: tram_stop_walk_min
        label: {pl: "Najbliższy tramwaj", cs: "Nejbližší tramvaj", en: "Nearest tram stop"}
        unit: min
        norm: {type: decay, good: 4, bad: 12}
        walkScaled: true
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [gtfs_ztp], praha: [gtfs_pid]}
        explain: {pl: "Tramwaj {{value}} min pieszo", cs: "Tramvaj {{value}} min pěšky", en: "Tram {{value}} min walk"}
      - id: departures_per_h_500m
        label: {pl: "Odjazdy w szczycie (500 m)", cs: "Odjezdy ve špičce (500 m)", en: "Peak departures (500 m)"}
        unit: dep_h
        norm: {type: percentile}
        weight: 3
        crossCity: true
        priority: P0
        sources: {krakow: [gtfs_ztp], praha: [gtfs_pid]}
        explain: {pl: "{{value}} odj./h w promieniu 500 m", cs: "{{value}} odj./h do 500 m", en: "{{value}} departures/h within 500 m"}
      - id: lines_500m
        label: {pl: "Linie w promieniu 500 m", cs: "Linky do 500 m", en: "Lines within 500 m"}
        unit: count
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [gtfs_ztp], praha: [gtfs_pid]}
        explain: {pl: "Linie w promieniu 500 m: {{value}}", cs: "Linky do 500 m: {{value}}", en: "{{value}} lines within 500 m"}
      - id: rail_station_walk_min       # K: SKA/rail · P: metro + S-trains (labels overridden in config/cities/*.yaml)
        label: {pl: "Stacja kolejowa", cs: "Železniční stanice", en: "Rail station"}
        unit: min
        norm: {type: decay, good: 5, bad: 20}
        walkScaled: true
        weight: 2
        crossCity: true
        priority: P0
        sources: {krakow: [gtfs_ztp, osm_krakow], praha: [gtfs_pid]}
        explain: {pl: "Stacja kolejowa {{value}} min pieszo", cs: "Nádraží {{value}} min pěšky", en: "Rail station {{value}} min walk"}
      - id: night_departures_500m
        label: {pl: "Nocne odjazdy (500 m)", cs: "Noční odjezdy (500 m)", en: "Night departures (500 m)"}
        unit: count
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [gtfs_ztp], praha: [gtfs_pid]}
        explain: {pl: "Nocne odjazdy w pobliżu (23–5): {{value}}", cs: "Noční odjezdy poblíž (23–5): {{value}}", en: "{{value}} night departures nearby (23–05)"}

  # ───────────────────────────────────────────── active
  - id: active
    emoji: "🚲"
    label: {pl: "Rower i spacery", cs: "Kolo a chůze", en: "Cycling & walking"}
    indicators:
