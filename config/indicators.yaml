        crossCity: true
        priority: P0
        sources: {krakow: [gtfs_ztp], praha: [gtfs_pid]}
        explain: {pl: "Przystanki bez barier w pobliżu: {{value}}%", cs: "Bezbariérové zastávky poblíž: {{value}} %", en: "Step-free stops nearby: {{value}}%"}
      - id: lowfloor_trip_share         # GTFS trips.wheelchair_accessible=1 among trips at stops within 500 m
