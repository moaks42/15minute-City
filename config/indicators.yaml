        sources: {krakow: [msip], praha: [ipr]}
        explain: {pl: "Hałas ok. {{value}} dB", cs: "Hluk cca {{value}} dB", en: "Noise ~{{value}} dB"}
      - id: pm25
        label: {pl: "Pył PM2,5", cs: "Prach PM2,5", en: "PM2.5"}
        unit: ugm3
        decimals: 1
        norm: {type: inverse_percentile}
        weight: 2
        crossCity: false        # city-level offset (K Lden vs P LAeq; regional PM) dominates → not comparable across cities
        priority: P0
        sources: {krakow: [gios], praha: [chmi_air]}
        explain: {pl: "PM2,5 ok. {{value}} µg/m³", cs: "PM2,5 cca {{value}} µg/m³", en: "PM2.5 ~{{value}} µg/m³"}
      - id: pm10
