      - id: accessible_stop_share       # GTFS stops.wheelchair_boarding=1 within 500 m
        label: {pl: "Przystanki bez barier (500 m)", cs: "Bezbariérové zastávky (500 m)", en: "Step-free stops (500 m)"}
