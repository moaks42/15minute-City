    label: {pl: "Cisza i czyste powietrze", cs: "Klid a čisté ovzduší", en: "Quiet & clean air"}
    indicators:
      - id: noise_db                    # max of road/tram/rail, area-weighted. K: Lden (MSIP) · P: LAeq/Ldvn (IPR)
        label: {pl: "Hałas", cs: "Hluk", en: "Noise"}
        unit: db
        norm: {type: inverse_percentile}
        weight: 3
        crossCity: false        # city-level offset (K Lden vs P LAeq; regional PM) dominates → not comparable across cities
