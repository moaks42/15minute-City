        unit: per_km2
        norm: {type: percentile}
        weight: 2
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Gęsta sieć ulic: {{value}} skrzyżowań/km²", cs: "Hustá síť ulic: {{value}} křižovatek/km²", en: "Walkable grid: {{value}} intersections/km²"}
      - id: bike_racks_300m
        label: {pl: "Stojaki rowerowe (300 m)", cs: "Stojany na kola (300 m)", en: "Bike racks (300 m)"}
        unit: count
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow, ztp_hub], praha: [osm_praha]}
        explain: {pl: "Stojaki rowerowe w promieniu 300 m: {{value}}", cs: "Stojany na kola do 300 m: {{value}}", en: "{{value}} bike racks within 300 m"}
      - id: car_free_walk_min
        label: {pl: "Bulwary i deptaki", cs: "Nábřeží a pěší zóny", en: "Riverside & pedestrian zones"}
        unit: min
        norm: {type: decay, good: 5, bad: 20}
        walkScaled: true
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha]}
        explain: {pl: "Bulwar lub deptak {{value}} min pieszo", cs: "Nábřeží či pěší zóna {{value}} min pěšky", en: "Riverside or pedestrian zone {{value}} min walk"}
      - id: bikeshare_walk_min
