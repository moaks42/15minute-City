# ───────────────────────────────────────────── neighbourhood archetypes (pooled KMeans → MLP)
# The API returns ids only. Workstream C owns the pl/cs/en names ("archetype.<id>" in web/src/locales).
# k is chosen in 6–8 by silhouette; clusters are mapped to these ids by profile, unused ids are simply absent.
archetypes:
  - {id: historic_core,     emoji: "🏛️", hint: "dense historic centre: top transit, food & culture; noisy, little green"}
  - {id: urban_mix,         emoji: "🏙️", hint: "dense mixed-use inner city: good transit & shops, average green"}
  - {id: student_buzz,      emoji: "🎓", hint: "near universities: nightlife, food, frequent transit"}
  - {id: estate_blocks,     emoji: "🏢", hint: "large housing estates (blokowisko / sídliště): shops, transit, playgrounds"}
  - {id: green_residential, emoji: "🌳", hint: "leafy residential: parks, quiet, decent services"}
  - {id: family_suburb,     emoji: "🏡", hint: "suburban: schools & playgrounds, longer walks to transit"}
  - {id: quiet_outskirts,   emoji: "🌾", hint: "edge of the city: low density, forest/meadow, far from services"}
  - {id: industrial_edge,   emoji: "🏭", hint: "next to industry, rail yards or major roads"}

# ───────────────────────────────────────────── server-side text templates
texts:
  budget: {pl: "Za Twój budżet ~{{value}} m²", cs: "Za váš rozpočet ~{{value}} m²", en: "Your budget ≈ {{value}} m²"}
  noData: {pl: "brak danych", cs: "chybí data", en: "no data"}
  imputed: {pl: "szacunek (mediana miasta)", cs: "odhad (medián města)", en: "estimate (city median)"}
  airLevel:            # LiveAir.level — common 0–5 scale (GIOŚ index ids map 1:1; ČHMÚ/Golemio mapped by PM thresholds)
    0: {pl: "Bardzo dobra",  cs: "Velmi dobrá",   en: "Very good"}
    1: {pl: "Dobra",         cs: "Dobrá",         en: "Good"}
    2: {pl: "Umiarkowana",   cs: "Uspokojivá",    en: "Moderate"}
    3: {pl: "Dostateczna",   cs: "Vyhovující",    en: "Sufficient"}
    4: {pl: "Zła",           cs: "Špatná",        en: "Poor"}
    5: {pl: "Bardzo zła",    cs: "Velmi špatná",  en: "Very poor"}
  relax:
    price:     {pl: "Bez limitu ceny pasujących miejsc: {{count}}", cs: "Bez cenového limitu vyhovujících míst: {{count}}", en: "Without the price limit: {{count}} matching places"}
