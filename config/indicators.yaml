      - id: park_walk_min               # park ≥ 2 ha
        label: {pl: "Park (≥ 2 ha)", cs: "Park (≥ 2 ha)", en: "Park (≥ 2 ha)"}
        unit: min
        norm: {type: decay, good: 5, bad: 20}
        walkScaled: true
        weight: 3
        crossCity: true
        priority: P0
        sources: {krakow: [osm_krakow, krk_open], praha: [osm_praha, ipr, golemio]}
        explain: {pl: "Park {{value}} min pieszo", cs: "Park {{value}} min pěšky", en: "Park {{value}} min walk"}
      - id: forest_meadow_ha_1km
        label: {pl: "Lasy i łąki (1 km)", cs: "Lesy a louky (1 km)", en: "Forest & meadows (1 km)"}
        unit: ha
        norm: {type: percentile}
        weight: 1
        crossCity: true
        priority: P1
        sources: {krakow: [osm_krakow], praha: [osm_praha, ipr]}
        explain: {pl: "{{value}} ha lasów i łąk w promieniu 1 km", cs: "{{value}} ha lesů a luk do 1 km", en: "{{value}} ha of forest & meadow within 1 km"}

