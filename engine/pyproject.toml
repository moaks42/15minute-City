[project]
name = "kompas-engine"
version = "0.1.0"
description = "Kompas scoring engine (Kraków + Praha): FastAPI + NumPy + scikit-learn"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "h3>=4,<5",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "cachetools>=5.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.21"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
