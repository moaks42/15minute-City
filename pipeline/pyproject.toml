[project]
name = "kompas-pipeline"
version = "0.1.0"
description = "Kompas data pipeline (Workstream A): OSM + GTFS + city open data -> H3 features for Krakow and Praha"
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "h3>=4.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scipy>=1.13",
    "httpx>=0.27",
    "requests>=2.32",
    "requests-cache>=1.2",
    "openpyxl>=3.1",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "osmnx>=2.0",
    "r5py>=0.1.2",
    "scikit-learn>=1.5",
    "rasterio>=1.3",
    "protobuf>=5",
    "gtfs-realtime-bindings>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
