# Render blueprint for the engine (Dashboard → New → Blueprint → this repo).
# The Docker build context is the repo root, so config/, contracts/ and data/processed/ get baked into the image.
services:
  - type: web
    name: kompas-engine
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: GOLEMIO_API_KEY
        sync: false
