# Local run and venue fallback: `docker compose up --build`
# engine → http://localhost:8000/docs · web → http://localhost:5173
services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data/processed
      CONFIG_DIR: /app/config
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: web
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - engine
