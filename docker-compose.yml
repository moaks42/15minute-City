# Optional: the engine in Docker (`docker compose up --build` → http://localhost:8000/docs).
# The web app runs with npm (see README "Run locally"); point it at VITE_API_URL=http://localhost:8000.
services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data/processed
      CONFIG_DIR: /app/config
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
